name: Terraform Apply Pipeline

# Runs when Terraform files change, after the Application Pipeline
# finishes, or when you press "Run workflow"
on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_run:
    workflows: ["Application Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read  # checkout

# Stops two Terraform pipelines changing things at the same time
concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # If started by the Application Pipeline, only run if that succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::843447001879:role/github-terraform-role
          aws-region: eu-west-1

      # Uses the newest image in ECR, so this works no matter what started the pipeline
      - name: Find latest image tag in ECR
        id: image
        run: |
          TAG=$(aws ecr describe-images --repository-name razzia-app \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' --output text)
          echo "Using image tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_image_tag: ${{ steps.image.outputs.tag }}
          TF_VAR_app_password: ${{ secrets.MANAGER_PASSWORD }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan
          terraform apply -auto-approve

      - name: Post deploy check
        run: |
          aws ecs wait services-stable --cluster razzia-app-ecs-cluster --services razzia-container
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors https://aws.zainabf.co.uk/healthname: Terraform Apply Pipeline

